name: system

# be/.env  → be, queue, go-app, go-queue (+ postgres creds via ${DB_*} in dev)
# fe/.env  → fe (dev only)
# .env     → NGINX_HTTP_PORT + GO_APP_IMAGE (Docker Hub tag) — auto-loaded by compose
#
# Profiles (combine with --profile; the core needs only Postgres):
#   dev        — make up / make up-d   (postgres + be + fe + nginx, hot reload)
#   prod       — make prod             (pull GO_APP_IMAGE + nginx; DB is external)
#   cache      — + redis               (set REDIS_URL in be/.env)
#   queue      — + nats + queue worker (dev; set NATS_ENABLED=true in be/.env)
#   prod-queue — + nats + go-queue     (prod)

services:
  postgres:
    profiles: [dev]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-myapp_pg}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-myapp_pg}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - system_net

  redis:
    profiles: [cache]
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./docker/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - system_net


  nats:
    profiles: [queue, prod-queue]
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    volumes:
      - ./docker/data/nats:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - system_net

  be:
    profiles: [dev]
    build:
      context: ./be
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./be/.env
    volumes:
      - ./be:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - system_net

  queue:
    profiles: [queue]
    build:
      context: ./be
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: ["go", "run", "./cmd/queue"]
    env_file:
      - ./be/.env
    volumes:
      - ./be:/app
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - system_net

  fe:
    profiles: [dev]
    build:
      context: ./fe
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./fe/.env
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
      - fe_next:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
    depends_on:
      - be
    networks:
      - system_net

  nginx:
    profiles: [dev]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/config:/etc/nginx/config:ro
    depends_on:
      - be
      - fe
    networks:
      - system_net

  # Prod Go services pull a pre-built image (Docker Hub). No source build on the server.
  # Set GO_APP_IMAGE in root .env (e.g. youruser/go-app:1.0.0). Publish with: make build
  go-app:
    profiles: [prod]
    image: ${GO_APP_IMAGE:-youruser/go-app:latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ./be/.env
    networks:
      - system_net

  go-queue:
    profiles: [prod-queue]
    image: ${GO_APP_IMAGE:-youruser/go-app:latest}
    pull_policy: always
    restart: unless-stopped
    command: ["./queue"]
    env_file:
      - ./be/.env
    depends_on:
      go-app:
        condition: service_started
      nats:
        condition: service_healthy
    networks:
      - system_net

  nginx-prod:
    profiles: [prod]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/config:/etc/nginx/config:ro
    depends_on:
      - go-app
    networks:
      - system_net

networks:
  system_net:
    driver: bridge

volumes:
  fe_node_modules:
  fe_next:
