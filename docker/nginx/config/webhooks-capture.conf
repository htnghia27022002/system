# Public webhook capture product URL → BE ingest (005-webhooks-tool).
# Must be included BEFORE the FE catch-all so /tools/webhooks/{uuid} never hits Next.js owner UI.
# Owner UI remains /tools/webhooks (no UUID) via FE. nginx client_max_body_size is 20m;
# BE enforces the 1 MiB capture body limit in application code.

# Escape \{36\} so nginx does not treat braces as config syntax (PCRE quantifier).
location ~ ^/tools/webhooks/([0-9a-fA-F-]\{36\})$ {
    proxy_pass http://be_upstream/api/webhooks/capture/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Method, query, and body are forwarded by default.
    proxy_request_buffering on;
}
